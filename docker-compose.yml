version: '3.9'

services:
  minecraft:
    user: "1000:1000"
    build:
      context: .
    container_name: "minecraft"
    read_only: true
    tmpfs:
    - /tmp:rw,exec,nosuid,nodev,size=128m
    volumes:
      - ./data:/data:rw
      - ./backups/:/backups:rw
      - ./config.json:/config/config.json:ro
      - minecraft_versions:/opt/minecraft/versions
    ports:
      - "25565:25565"
      - "8123:8123"
    networks:
      - minecraft
    stdin_open: true
    tty: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    stop_grace_period: 5m

networks:
  minecraft:
    name: minecraft

volumes:
  minecraft_versions: